experiment_name: "Asperity_Inverse_Design_v1"

physics:
  n_asperities: 16
  max_delta_ratio: 0.1
  radius: 1.0
  E_star: 1.0

data:
  path: "data/dataset_16_asp_mixed.pt"
  n_steps: 500
  n_samples: 500000

model:
  hidden_dim: 1024

training:
  batch_size: 256
  epochs: 300
  learning_rate: 0.001
  device: "cuda"

generation:
  ratios:
    lhs: 0.25        
    random_sum: 0.20
    single: 0.05
    wall: 0.15      
    sparse: 0.15
    switch: 0.20

scheduler:
  type: "ReduceLROnPlateau"
  patience: 5
  factor: 0.5