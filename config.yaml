experiment_name: "Asperity_Inverse_Design_v5_P_Star"

physics:
  n_asperities: 9              # CRITICAL: MUST be a perfect square (4, 9, 16)
  max_delta_ratio: 0.1         # Elastic regime limit
  radius: 1.0                   # Dimensionless 
  E_star: 1.0                  # Dimensionless scaling enabled

data:
  path: "data/dataset_asp_unitcell.pt"
  n_steps: 128
  n_samples: 200000

model:
  hidden_dim: 512 #256
  name: "model_best_unitcell_annealing_no_lambda.pth"

training:
  batch_size: 512 #1024
  epochs: 500
  learning_rate: 0.001
  patience: 100
  device: "cuda"
  loss_weights:
    w_stiff: 2.0               # Weight for the dP/dAlpha topology & cliffs
    w_pressure: 4.0            # Weight for the Intensive Pressure anchor
  scheduler:
    type: "CosineAnnealingLR"  # Ignores validation noise
    eta_min: 1.0e-4            # Minimum learning rate

generation:
  ratios:
    lhs: 0.16          # Space-filling baseline
    random_sum: 0.16    # Standard averaged topologies
    exiled: 0.16        # Teaches the network how to hide unused asperities
    bimodal: 0.16       # Teaches violent stiffness cliffs
    wall: 0.16          # 9-asperity simultaneous contact
    sparse: 0.16        # Sequential multi-step contacts
