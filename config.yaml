experiment_name: "Asperity_Inverse_Design_v5_P_Star"

physics:
  n_asperities: 9              # CRITICAL: MUST be a perfect square (4, 9, 16)
  max_delta_ratio: 0.1         # Elastic regime limit
  radius: 1.0                   # Dimensionless 
  E_star: 1.0                  # Dimensionless scaling enabled

data:
  path: "data/dataset_asp_unitcell.pt"
  n_steps: 500
  n_samples: 250000

model:
  hidden_dim: 256
  name: "model_best_unitcell.pth"

training:
  batch_size: 4096
  epochs: 200
  learning_rate: 0.001
  device: "cuda"
  loss_weights:
    w_stiff: 4.0               # Weight for the dP/dAlpha topology & cliffs
    w_pressure: 4.0            # Weight for the Intensive Pressure anchor
  scheduler:
    type: "CosineAnnealingLR"  # Ignores validation noise
    eta_min: 1.0e-6            # Minimum learning rate

generation:
  ratios:
    lhs: 0.20           # Space-filling baseline
    random_sum: 0.20    # Standard averaged topologies
    exiled: 0.20        # Teaches the network how to hide unused asperities
    bimodal: 0.20       # Teaches violent stiffness cliffs
    wall: 0.20          # 9-asperity simultaneous contact
    sparse: 0.20        # Sequential multi-step contacts