experiment_name: "Asperity_Inverse_Design_v4_Intensive"

physics:
  n_asperities: 9              # CRITICAL: MUST be a perfect square (4, 9, 16)
  max_delta_ratio: 0.1         # Elastic regime limit
  radius: 0.001                # STRICT PHYSICAL SCALE: 1 mm
  E_star: 1.0                  

data:
  path: "data/dataset_asp_unitcell.pt"
  n_steps: 500
  n_samples: 50000

model:
  hidden_dim: 256
  name: "model_best_unitcell.pth"

training:
  batch_size: 256
  epochs: 300
  learning_rate: 0.001
  device: "cuda"
  loss_weights:
    w_stiff: 1.0               # Weight for the dP/dAlpha topology & cliffs (L1 + MSE)
    w_pressure: 2.0            # Weight for the Intensive Pressure anchor (MSE)
  scheduler:
    type: "ReduceLROnPlateau"
    patience: 20
    factor: 0.5

generation:
  oversample_factor: 5         # Generates 250k samples before K-Means reduction
  n_clusters: 2000             # Number of behavioral clusters for Coreset Selection
  ratios:
    lhs: 0.25        
    random_sum: 0.20
    single: 0.05
    wall: 0.15      
    sparse: 0.15
    switch: 0.20